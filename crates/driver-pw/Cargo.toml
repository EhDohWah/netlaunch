[package]
name = "netlaunch-driver-pw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NetLaunch BrowserDriver on playwright-rs: launches Edge itself and attaches over CDP."

[dependencies]
netlaunch-engine = { path = "../engine" }
playwright-rs.workspace = true
secrecy = "0.10"
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry = "0.5"

[dev-dependencies]
netlaunch-mock-site = { path = "../mock-site" }
tokio = { workspace = true, features = ["sync"] }
tracing-subscriber.workspace = true

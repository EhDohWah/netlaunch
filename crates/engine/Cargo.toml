[package]
name = "netlaunch-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NetLaunch login engine: recipes, origin check, result detection. Talks to the browser only through the BrowserDriver trait."

[dependencies]
# For `normalize_origin` (the same function the vault uses when saving a
# site) and `LoginOutcome` (what goes into login_log).
netlaunch-vault = { path = "../vault" }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber.workspace = true

[package]
name = "netlaunch-mock-site"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Mock admin-console login site for testing NetLaunch without touching real devices."

[lib]
path = "src/lib.rs"

[[bin]]
name = "mock-site"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "json", "query"] }
axum-server = { version = "0.9", default-features = false, features = ["tls-rustls-no-provider"] }
# ring, not aws-lc: ring is already in the build and compiles on Windows
# with only the MSVC toolchain.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[package]
name = "netlaunch-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NetLaunch credential vault: SQLite, DPAPI-wrapped data key, XChaCha20-Poly1305 password encryption."

[dependencies]
# `bundled` compiles SQLite into the app, so nothing has to be installed on
# the PC and every machine runs the same SQLite version.
rusqlite = { version = "0.41", features = ["bundled"] }
chacha20poly1305 = "0.10"
getrandom = "0.3"
secrecy = "0.10"
zeroize = "1"
thiserror = "2"
url = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
serde_json.workspace = true

[features]
# Exposes InsecureTestProtector so other crates' tests (the login engine)
# can open a vault without DPAPI. Never enable it in the app.
insecure-test-protector = []

[package]
name = "netlaunch-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NetLaunch desktop app (Tauri shell)."

[[bin]]
name = "netlaunch"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# `serde` lets a SecretString be *deserialized* from the frontend's input.
# It can't be serialized, so a command can't return one by mistake.
secrecy = { version = "0.10", features = ["serde"] }
netlaunch-vault = { path = "../../crates/vault" }

[dev-dependencies]
# Tests only: open a vault without DPAPI.
netlaunch-vault = { path = "../../crates/vault", features = ["insecure-test-protector"] }
serde_json.workspace = true

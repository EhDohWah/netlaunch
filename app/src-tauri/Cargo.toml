[package]
name = "netlaunch-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NetLaunch desktop app (Tauri shell)."

[[bin]]
name = "netlaunch"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep on the same minor version as @tauri-apps/api and @tauri-apps/cli
# in ../package.json, or `cargo tauri dev` reports a version mismatch.
# 2.12 needs Rust 1.90; upgrade all three together.
tauri = { version = "~2.11", features = [] }
serde = { version = "1", features = ["derive"] }
# `serde` lets a SecretString be *deserialized* from the frontend's input.
# It can't be serialized, so a command can't return one by mistake.
secrecy = { version = "0.10", features = ["serde"] }
netlaunch-vault = { path = "../../crates/vault" }
netlaunch-engine = { path = "../../crates/engine" }
netlaunch-driver-pw = { path = "../../crates/driver-pw" }
netlaunch-sessions = { path = "../../crates/sessions" }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Tests only: open a vault without DPAPI.
netlaunch-vault = { path = "../../crates/vault", features = ["insecure-test-protector"] }
serde_json.workspace = true
tokio.workspace = true

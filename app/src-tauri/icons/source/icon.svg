      <stop offset="0" stop-color="#31445C"/>
      <stop offset="1" stop-color="#16212E"/>
    </linearGradient>
  </defs>
  <rect x="18" y="18" width="220" height="220" rx="52" fill="url(#tile)" stroke="#5A7396" stroke-width="4"/>
  <rect x="52" y="66" width="152" height="128" rx="20" fill="#fff"/>
  <path d="M76 170v-62h28V90h48v18h28v62z" fill="#16212E"/>
  <g fill="#60CDFF">
    <rect x="90" y="142" width="10" height="28" rx="2"/>
    <rect x="107" y="142" width="10" height="28" rx="2"/>
    <rect x="123" y="142" width="10" height="28" rx="2"/>
    <rect x="139" y="142" width="10" height="28" rx="2"/>
    <rect x="156" y="142" width="10" height="28" rx="2"/>

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No test launches a browser yet, so skip the ~130 MB Playwright driver
  # download. Remove this when the M5 engine tests drive Edge.
  PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows runs everything, including the DPAPI tests and the
          # Tauri app (which only runs on Windows).
          - os: windows-latest
            cargo_args: --workspace
          # The app is Windows-only, and building it on Linux needs the
          # WebKitGTK libraries, so Linux skips it.
          - os: ubuntu-latest
            cargo_args: --workspace --exclude netlaunch-app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test ${{ matrix.cargo_args }}
      - name: Clippy
        run: cargo clippy ${{ matrix.cargo_args }} --all-targets -- -D warnings

  ui:
    name: ui (vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

[workspace]
resolver = "3"
members = [
    "crates/vault",
    "crates/engine",
    "crates/driver-pw",
    "crates/sessions",
    "crates/mock-site",
    "spike",
    "probe",
    "app/src-tauri",
]

# A local copy of a dependency, not part of this workspace (see below).
exclude = ["vendor/playwright-rs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# Pinned exactly: playwright-rs is pre-1.0 and bundles a specific Playwright
# server version. Upgrade on purpose, then re-run the mock-site suite.
playwright-rs = "=0.20.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde_json = "1"

# playwright-rs 0.20.1 with one change: on Windows it starts the Playwright
# driver (node.exe) without a console window. Without it, the installed app
# (a windowed program) opens a terminal next to every login window. Same
# version as the pin above; see vendor/playwright-rs/NETLAUNCH.md.
[patch.crates-io]
playwright-rs = { path = "vendor/playwright-rs" }
